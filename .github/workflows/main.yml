name: MLGodotKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: pip install scons

      - name: Install Eigen
        run: |
          powershell -Command "Invoke-WebRequest -Uri 'https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip' -OutFile 'eigen.zip'"
          powershell -Command "Expand-Archive -Path 'eigen.zip' -DestinationPath '${{ github.workspace }}/eigen_tmp' -Force"
          powershell -Command "New-Item -ItemType Directory -Force -Path '${{ github.workspace }}/eigen'"
          powershell -Command "Get-ChildItem -Path '${{ github.workspace }}/eigen_tmp' | Select-Object -First 1 | ForEach-Object { Copy-Item -Path \"$($_.FullName)\*\" -Destination '${{ github.workspace }}/eigen' -Recurse -Force }"
          Remove-Item -Path "eigen.zip"
          Remove-Item -Path "${{ github.workspace }}/eigen_tmp" -Recurse

      - name: Build GDExtension
        env:
          EIGEN_PATH: ${{ github.workspace }}/eigen
        run: |
          cd mlgodotkit
          scons platform=windows

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlgodotkit-windows
          path: mlgodotkit/bin/
