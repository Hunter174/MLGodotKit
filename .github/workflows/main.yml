name: MLGodotKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: pip install scons

      - name: Install Eigen
        run: |
          curl -L https://github.com/eigen-team/eigen3/archive/3.4.0.zip -o eigen.zip
          powershell -Command "Expand-Archive -Path eigen.zip -DestinationPath C:/eigen_tmp"
          # Find the folder inside eigen_tmp (it might be eigen-3.4.0 or similar)
          powershell -Command "Get-ChildItem -Path C:/eigen_tmp | Select-Object -First 1 | Move-Item -Destination 'C:/eigen' -Force"
          Remove-Item -Path "eigen.zip"
          Remove-Item -Path "C:/eigen_tmp" -Recurse
          # The project expects a specific structure or path. 
          # We will set the EIGEN_PATH environment variable.

      - name: Build GDExtension
        env:
          EIGEN_PATH: C:/eigen
        run: |
          cd mlgodotkit
          scons platform=windows

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlgodotkit-windows
          path: mlgodotkit/bin/
