name: MLGodotKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: pip install scons

      - name: Install Eigen
        run: |
          powershell -Command "(New-Object System.Net.WebClient).DownloadFile('https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip', 'eigen.zip')"
          powershell -Command "Expand-Archive -Path 'eigen.zip' -DestinationPath 'C:/eigen_tmp' -Force"
          powershell -Command "New-Item -ItemType Directory -Force -Path 'C:/eigen'"
          powershell -Command "$folder = Get-ChildItem -Path 'C:/eigen_tmp' | Select-Object -First 1; Copy-Item -Path \"$($folder.FullName)\*\" -Destination 'C:/eigen' -Recurse -Force"
          powershell -Command "Get-ChildItem -Path 'C:/eigen'"
          Remove-Item -Path "eigen.zip"
          Remove-Item -Path "C:/eigen_tmp" -Recurse

      - name: Build GDExtension
        env:
          EIGEN_PATH: C:/eigen
        run: |
          cd mlgodotkit
          scons platform=windows

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlgodotkit-windows
          path: mlgodotkit/bin/
