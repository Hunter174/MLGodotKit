name: MLGodotKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: pip install scons

      - name: Install Eigen
        run: |
          powershell -File mlgodotkit/scripts/install_eigen.ps1

      - name: Build GDExtension
        env:
          EIGEN_PATH: ${{ github.workspace }}/eigen
        run: |
          dir ${{ github.workspace }}/eigen
          cd mlgodotkit
          scons platform=windows

      - name: Build and run native tests
        working-directory: mlgodotkit
        env:
          EIGEN_PATH: ${{ github.workspace }}/eigen
        run: |
          scons platform=windows tests=1
          .\\test\\bin\\mlgodotkit_core_tests.exe

      - name: Run Godot headless smoke test
        shell: pwsh
        run: powershell -File scripts/run_godot_smoke.ps1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlgodotkit-windows
          path: mlgodotkit/bin/
