name: MLGodotKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python & SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: pip install scons

      - name: Install Eigen
        run: |
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/eigen-team/eigen3/archive/refs/tags/3.4.0.zip' -OutFile 'eigen.zip'"
          powershell -Command "Expand-Archive -Path 'eigen.zip' -DestinationPath 'C:/eigen_tmp' -Force"
          powershell -Command "$folder = Get-ChildItem -Path 'C:/eigen_tmp' | Select-Object -First 1; Move-Item -Path \"$($folder.FullName)\*\" -Destination 'C:/eigen' -Force"
          Remove-Item -Path "eigen.zip"
          Remove-Item -Path "C:/eigen_tmp" -Recurse

      - name: Build GDExtension
        env:
          EIGEN_PATH: C:/eigen
        run: |
          cd mlgodotkit
          scons platform=windows

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlgodotkit-windows
          path: mlgodotkit/bin/
