name: Release MLGodotKit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install scons

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tag) {
            throw "Release tag v$tag does not match VERSION ($version)."
          }
          $plugin = Get-Content mlgodotkit/addon/plugins/plugin.cfg -Raw
          if ($plugin -notmatch "version=\"$([regex]::Escape($version))\"") {
            throw "plugin.cfg version does not match VERSION ($version)."
          }
          "MLGodotKit version: $version"

      - name: Download Eigen
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip" `
            -OutFile eigen.zip
          Expand-Archive eigen.zip -DestinationPath third_party
          "EIGEN_PATH=$((Resolve-Path 'third_party/eigen-3.4.0').Path)" >> $env:GITHUB_ENV

      - name: Build release extension
        working-directory: mlgodotkit
        run: scons platform=windows target=template_release eigen_path="$env:EIGEN_PATH"

      - name: Package addon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/addons | Out-Null
          Copy-Item -Recurse test_project/addons/mlgodotkit package/addons/mlgodotkit
          Copy-Item LICENSE package/LICENSE
          Copy-Item README.md package/README.md
          Copy-Item VERSION package/VERSION
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "mlgodotkit-v$version-windows.zip"
          Compress-Archive -Path package/* -DestinationPath $archive
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ARCHIVE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
