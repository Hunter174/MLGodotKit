name: Release MLGodotKit

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository and dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install scons

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content MLGODOTKIT_VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -ne $tag) {
            throw "Release tag v$tag does not match MLGODOTKIT_VERSION ($version)."
          }
          $plugin = Get-Content mlgodotkit/addon/plugins/plugin.cfg -Raw
          $version_pattern = 'version="' + [regex]::Escape($version) + '"'
          if ($plugin -notmatch $version_pattern) {
            throw "plugin.cfg version does not match MLGODOTKIT_VERSION ($version)."
          }
          "MLGodotKit version: $version"

      - name: Download Eigen
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip" `
            -OutFile eigen.zip
          Expand-Archive eigen.zip -DestinationPath third_party
          "EIGEN_PATH=$((Resolve-Path 'third_party/eigen-3.4.0').Path)" >> $env:GITHUB_ENV

      - name: Build release extension
        working-directory: mlgodotkit
        run: scons platform=windows target=template_release eigen_path="$env:EIGEN_PATH"

      - name: Run release Godot smoke test
        shell: pwsh
        env:
          GODOT_VERSION: 4.4.1
          GODOT_RELEASE_TAG: 4.4.1-stable
          GODOT_LIBRARY_CONFIGURATION: release
        run: powershell -File scripts/run_godot_smoke.ps1

      - name: Package addon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/addons | Out-Null
          Copy-Item -Recurse test_project/addons/mlgodotkit package/addons/mlgodotkit
          Copy-Item LICENSE package/LICENSE
          Copy-Item README.md package/README.md
          Copy-Item CHANGELOG.md package/CHANGELOG.md
          Copy-Item MLGODOTKIT_VERSION package/MLGODOTKIT_VERSION
          $version = (Get-Content MLGODOTKIT_VERSION -Raw).Trim()
          $archive = "mlgodotkit-v$version-windows.zip"
          Compress-Archive -Path package/* -DestinationPath $archive
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Validate release package
        shell: pwsh
        run: |
          $archive = $env:RELEASE_ARCHIVE
          if (-not (Test-Path $archive)) { throw "Release archive was not created: $archive" }
          $temp = Join-Path $env:RUNNER_TEMP "mlgodotkit-package"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $temp
          $addon = Join-Path $temp "addons/mlgodotkit"
          $releaseDll = Join-Path $addon "bin/mlgodotkit.windows.template_release.x86_64.dll"
          $debugDll = Join-Path $addon "bin/mlgodotkit.windows.template_debug.x86_64.dll"
          foreach ($required in @(
            $releaseDll,
            (Join-Path $addon "mlgodotkit.gdextension"),
            (Join-Path $addon "plugins/plugin.cfg"),
            (Join-Path $temp "MLGODOTKIT_VERSION"),
            (Join-Path $temp "LICENSE"),
            (Join-Path $temp "README.md"),
            (Join-Path $temp "CHANGELOG.md")
          )) {
            if (-not (Test-Path $required)) { throw "Required release file is missing: $required" }
          }
          if (Test-Path $debugDll) { throw "Debug binary must not be included in a release package." }
          "Validated release package: $archive"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ARCHIVE }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
